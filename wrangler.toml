# Cloudflare Workers with static assets: serves the static `dist/` output from
# `pnpm build`. No Worker code and no secrets; Cloudflare's Git integration
# runs `pnpm build` and then `npx wrangler deploy` on every push to main.
# `public/_headers` (CSP, caching) and `404.html` are honored by the assets host.
name = "agentic-rails-atlas"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Request logs in the Cloudflare dashboard (Observability tab). Kept here so a
# deploy from git does not reset what was enabled in the dashboard.
[observability.logs]
enabled = true
invocation_logs = true
persist = true
